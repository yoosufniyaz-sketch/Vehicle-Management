<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FDC Vehicle Management</title>
<meta name="description" content="Portal to manage all FDC corporate vehicles">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101826;--paper:#eef0ee;--surface:#ffffff;--surface-2:#f6f7f6;
  --line:#dde1e4;--line-strong:#c3c9d0;--steel:#56637a;--steel-soft:#8b96a8;
  --accent:#14406b;--accent-strong:#0d2f4e;--accent-soft:#e6ecf1;--on-accent:#ffffff;
  --good:#2f8f5b;--good-soft:#e6f4ec;--warn:#a9760a;--warn-soft:#fbf1dd;--critical:#b3261e;--critical-soft:#fbe9e7;
  --shadow:0 1px 2px rgba(16,24,38,.06),0 4px 14px rgba(16,24,38,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#eef1f5;--paper:#0e131a;--surface:#161d27;--surface-2:#1b2330;
  --line:#263142;--line-strong:#344256;--steel:#a3adbd;--steel-soft:#77839a;
  --accent:#7fb0e0;--accent-strong:#a9cbef;--accent-soft:#1c2c40;--on-accent:#0b1522;
  --good:#5cc08a;--good-soft:#16301f;--warn:#e0ac3c;--warn-soft:#33280f;--critical:#f07a70;--critical-soft:#3a1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --ink:#eef1f5;--paper:#0e131a;--surface:#161d27;--surface-2:#1b2330;
  --line:#263142;--line-strong:#344256;--steel:#a3adbd;--steel-soft:#77839a;
  --accent:#7fb0e0;--accent-strong:#a9cbef;--accent-soft:#1c2c40;--on-accent:#0b1522;
  --good:#5cc08a;--good-soft:#16301f;--warn:#e0ac3c;--warn-soft:#33280f;--critical:#f07a70;--critical-soft:#3a1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Oswald",system-ui,sans-serif;font-weight:600;letter-spacing:.01em;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}

/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px}
.brand{padding:0 8px 22px}
.brand .mark{font-family:"Oswald";font-weight:700;font-size:19px;text-transform:uppercase;color:var(--accent-strong);letter-spacing:.03em;line-height:1.1}
.brand .sub{font-size:11px;text-transform:uppercase;color:var(--steel);letter-spacing:.12em;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--steel);padding:10px 10px;border-radius:8px;text-align:left;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-strong)}
.nav .num{font-family:"IBM Plex Mono";font-size:11px;color:var(--steel-soft);width:18px}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:12px;color:var(--steel);display:flex;flex-direction:column;gap:8px}
.sync{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--steel-soft);display:inline-block;flex:none}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--critical)}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;text-align:left;font-size:12px}

/* Main */
main{min-width:0;padding:26px 30px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:26px;text-transform:uppercase}
.top p{margin:4px 0 0;color:var(--steel)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--steel-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.danger{color:var(--critical);border-color:var(--critical-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--steel)}
.kpi .v{font-family:"Oswald";font-size:28px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v.crit{color:var(--critical)}.kpi .v.warn{color:var(--warn)}
.kpi .s{font-size:12px;color:var(--steel-soft)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15px;text-transform:uppercase}
.alerts{list-style:none;margin:0;padding:4px 0;max-height:240px;overflow:auto}
.alerts li{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.alerts li:last-child{border-bottom:0}
.alerts li:hover{background:var(--surface-2)}
.alerts .what{flex:1;min-width:0}
.alerts .what b{font-weight:600}
.empty{padding:26px 16px;text-align:center;color:var(--steel)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto}
.toolbar .grow{flex:1;min-width:180px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--steel);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--critical-soft);color:var(--critical);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent}
.badge{font-family:"IBM Plex Mono";font-size:11px;font-weight:600;background:var(--critical);color:#fff;border-radius:99px;padding:1px 7px}

/* Vehicle cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;display:flex;flex-direction:column}
.vcard:hover{box-shadow:var(--shadow);border-color:var(--line-strong)}
.vimg{aspect-ratio:16/9;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--steel-soft);overflow:hidden}
.vimg img{width:100%;height:100%;object-fit:cover;display:block}
.vbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.plate{font-family:"IBM Plex Mono";font-weight:600;font-size:15px;letter-spacing:.04em}
.vname{color:var(--steel);font-size:13px}
.statline{display:flex;gap:6px;flex-wrap:wrap}

/* Tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--steel);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{color:var(--steel-soft);font-size:12px}

.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:6px;color:var(--steel);font-weight:500}
.tabs button.on{background:var(--accent);color:var(--on-accent)}

/* Forms */
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--steel);font-weight:500}
label .req{color:var(--critical)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0}
legend{font-family:"Oswald";font-weight:600;text-transform:uppercase;font-size:13px;padding:0 6px;color:var(--accent-strong)}
.fsec{margin:18px 0 8px;font-family:"Oswald";text-transform:uppercase;font-size:14px;color:var(--steel);letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.fsec:after{content:"";flex:1;height:1px;background:var(--line)}
.hint{font-size:12px;color:var(--steel-soft);font-weight:400}
.imgpick{display:flex;gap:14px;align-items:center}
.imgpick .prev{width:160px;aspect-ratio:16/9;border-radius:8px;border:1px dashed var(--line-strong);background:var(--surface-2);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--steel-soft);font-size:12px;flex:none}
.imgpick .prev img{width:100%;height:100%;object-fit:cover}
.sp-row{display:flex;gap:6px}
.sp-row input{flex:1}

/* Modal & drawer */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.overlay[hidden]{display:none}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:860px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:18px;text-transform:uppercase}
.modal-b{padding:18px 20px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--steel);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface-2)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--paper);border-left:1px solid var(--line);z-index:40;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .2s ease}
.drawer:not(.open){box-shadow:none;visibility:hidden;transition:transform .2s ease,visibility 0s .2s}
.drawer.open{transform:none}
.drawer .hero{aspect-ratio:16/8;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--steel-soft);overflow:hidden}
.drawer .hero img{width:100%;height:100%;object-fit:cover}
.dhead{padding:16px 20px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:var(--surface);border-bottom:1px solid var(--line)}
.dbody{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.specs div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--steel-soft)}
.statcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-left:4px solid var(--line-strong)}
.statcard.good{border-left-color:var(--good)}.statcard.warn{border-left-color:var(--warn)}.statcard.crit{border-left-color:var(--critical)}
.statcard h3{font-size:14px;text-transform:uppercase}
.statcard .meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px;font-size:13px}
.statcard .meta span{display:block;font-size:11px;color:var(--steel-soft);text-transform:uppercase;letter-spacing:.06em}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.mini h3{font-size:13px;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--line)}
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.3);z-index:39}
.scrim[hidden]{display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

.who{display:flex;flex-direction:column;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mobile-tools{display:none}
.theme-toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:99px;padding:5px 12px 5px 8px;font-size:12.5px;align-self:flex-start}
.theme-toggle:hover{border-color:var(--steel-soft)}
.theme-toggle .ti-sun,.theme-toggle .ti-moon{font-size:14px;line-height:1;width:16px;text-align:center}
:root[data-mode="light"] .theme-toggle .ti-sun,:root[data-mode="dark"] .theme-toggle .ti-moon{display:none}
.theme-toggle.icon-only{padding:6px 9px}.theme-toggle.icon-only .tl{display:none}
.auth-theme{position:absolute;top:16px;right:16px}
/* Auth screen */
.auth{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.auth[hidden]{display:none}
body.locked .shell{visibility:hidden}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 26px;box-shadow:var(--shadow)}
.auth-brand{text-align:center;margin-bottom:20px}
.auth-brand .mark{font-family:"Oswald";font-weight:700;font-size:24px;text-transform:uppercase;color:var(--accent-strong);letter-spacing:.03em}
.auth-brand .sub{font-size:11px;text-transform:uppercase;color:var(--steel);letter-spacing:.14em;margin-top:2px}
.auth-tabs{display:flex;margin-bottom:18px}.auth-tabs button{flex:1}
.auth-submit{justify-content:center;padding:10px 14px}
.auth-msg{font-size:13px;padding:9px 11px;border-radius:7px;background:var(--critical-soft);color:var(--critical)}
.auth-msg.ok{background:var(--good-soft);color:var(--good)}
.auth [data-only][hidden]{display:none}
.pw{position:relative}.pw input{padding-right:58px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--accent);font-size:12px;padding:4px 6px}
@media (max-width:900px){
  .mobile-tools{display:inline-flex;gap:8px;align-items:center;margin-left:auto;flex:none}
  .shell{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;z-index:30;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{padding:0 6px 0 0;flex:none}.brand .sub{display:none}
  .nav{flex-direction:row}.nav .num{display:none}
  .nav button{white-space:nowrap;padding:8px 10px}
  .side-foot{display:none}
  main{padding:18px 16px 50px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .specs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .statcard .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .g2,.g3{grid-template-columns:1fr}.span2{grid-column:auto}
  .imgpick{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body class="locked">
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="mark">FDC Vehicle<br>Management</div></div>
    <nav class="nav" id="nav">
      <button data-view="vehicles" class="on"><span class="num">01</span>Vehicle Details<span class="badge" id="alertBadge" hidden></span></button>
      <button data-view="fueling"><span class="num">02</span>Fueling</button>
      <button data-view="servicing"><span class="num">03</span>Servicing</button>
    </nav>
    <div class="side-foot">
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Connecting…</span></div>
      <div class="who"><b id="whoName">—</b><span id="whoEmail" class="hint"></span></div>
      <button type="button" class="theme-toggle" data-act="toggleTheme" aria-label="Switch light / dark mode" title="Switch light / dark mode"><span class="ti-sun">☀</span><span class="ti-moon">☾</span><span class="tl"></span></button>
      <button class="linkbtn" data-act="settings">Settings &amp; notifications</button>
      <button class="linkbtn" data-act="signOut">Sign out</button>
    </div>
    <span class="mobile-tools"><button type="button" class="theme-toggle icon-only" data-act="toggleTheme" aria-label="Switch light / dark mode" title="Switch light / dark mode"><span class="ti-sun">☀</span><span class="ti-moon">☾</span><span class="tl"></span></button><button class="btn sm" data-act="signOut">Sign out</button></span>
  </aside>
  <main id="main"></main>
</div>

<!-- ============ LOGIN / REGISTER ============ -->
<section class="auth" id="auth">
  <button type="button" class="theme-toggle auth-theme" data-act="toggleTheme" aria-label="Switch light / dark mode" title="Switch light / dark mode"><span class="ti-sun">☀</span><span class="ti-moon">☾</span><span class="tl"></span></button>
  <div class="auth-card">
    <div class="auth-brand"><div class="mark">FDC Vehicle Management</div></div>
    <div class="tabs auth-tabs" role="tablist">
      <button type="button" data-auth="login" class="on">Sign in</button>
      <button type="button" data-auth="register">Register</button>
    </div>
    <div class="hint" id="authLoading" style="text-align:center">Checking sign-in…</div>
    <form id="authForm" novalidate hidden>
      <div class="grid">
        <label data-only="register">Full name <input name="name" autocomplete="name"></label>
        <label>Email address <input name="email" type="email" autocomplete="email" required></label>
        <label>Password
          <div class="pw"><input name="password" type="password" autocomplete="current-password" required><button type="button" class="pw-eye" data-act="togglePw" aria-label="Show password">Show</button></div>
        </label>
        <label data-only="register">Confirm password <input name="password2" type="password" autocomplete="new-password"></label>
        <div class="hint" data-only="register">At least 8 characters, including a letter and a number.</div>
        <div class="auth-msg" id="authMsg" role="alert" hidden></div>
        <button type="submit" class="btn primary auth-submit" id="authSubmit">Sign in</button>
        <button type="button" class="linkbtn" data-only="login" data-act="forgotPw" style="justify-self:center">Forgot password?</button>
      </div>
    </form>
  </div>
</section>

<div class="scrim" id="scrim" hidden data-act="closeDrawer"></div>
<aside class="drawer" id="drawer" aria-label="Vehicle details"></aside>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast"></div>

/* ================= SETTINGS (per browser) ================= */
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var settings = Object.assign({remindDays:30, spBase:"", currency:"Rf"}, lsGet("fdc_settings",{}));
/* Optional: only allow sign-up with these email domains, e.g. ["fdc.mv"]. Empty = any email.
   (Also enforce this in your Firestore security rules — see notes.) */
var ALLOWED_EMAIL_DOMAINS = [];
var currentUser = null;
var userName = "";

/* ================= STORE ================= */
var Store = {
  mode:"local", db:null,
  data:{vehicles:[],fuel_records:[],service_records:[]},
  unsubs:[],
  /* Start live listeners — called only after a successful email/password sign-in */
  start: function(){
    this.stop();
    this.db = this.db || firebase.firestore();
    this.mode = "cloud";
    var self=this;
    setSync("warn","Loading data…");
    COLS.forEach(function(c){
      self.unsubs.push(self.db.collection(c).onSnapshot(function(snap){
        self.data[c] = snap.docs.map(function(d){return Object.assign({id:d.id}, d.data());});
        setSync("good","Synced to cloud");
        render();
      }, function(err){
        console.error(err);
        setSync("crit", err.code==="permission-denied" ? "No database access — check Firestore rules" : "Database error ("+(err.code||err.message)+")");
      }));
    });
  },
  stop: function(){
    this.unsubs.forEach(function(u){try{u();}catch(e){}});
    this.unsubs=[];
    this.data={vehicles:[],fuel_records:[],service_records:[]};
  },
  save: async function(col,obj){
    obj = Object.assign({}, obj); var id = obj.id; delete obj.id;
    obj.updatedAt = Date.now(); obj.updatedBy = userName||"";
    if(!id){ obj.createdAt = Date.now(); obj.createdBy = userName||""; }
    if(this.mode==="cloud"){
      if(id) await this.db.collection(col).doc(id).set(obj,{merge:true});
      else { var ref = await this.db.collection(col).add(obj); id = ref.id; }
    } else {
      var list = this.data[col];
      if(id){ var i=list.findIndex(function(x){return x.id===id;}); list[i]=Object.assign({},list[i],obj,{id:id}); }
      else { id = "L"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); list.push(Object.assign({id:id},obj)); }
      lsSet("fdc_local_"+col, list); render();
    }
    return id;
  },
  remove: async function(col,id){
    if(this.mode==="cloud") await this.db.collection(col).doc(id).delete();
    else { this.data[col]=this.data[col].filter(function(x){return x.id!==id;}); lsSet("fdc_local_"+col,this.data[col]); render(); }
  }
};

/* ================= HELPERS ================= */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function money(v){return settings.currency+" "+num(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function money0(v){return settings.currency+" "+Math.round(num(v)).toLocaleString("en-US");}
function todayISO(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function parseISO(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function daysUntil(iso){var t=new Date();t.setHours(0,0,0,0);return Math.round((parseISO(iso)-t)/864e5);}
function fmtDate(iso){if(!iso)return "—";var d=parseISO(iso);return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});}
function addMonths(iso,m){var d=parseISO(iso);d.setMonth(d.getMonth()+m);d.setDate(d.getDate()-1);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function durationText(a,b){
  if(!a||!b) return "—";
  var s=parseISO(a),e=parseISO(b); var days=Math.round((e-s)/864e5)+1; if(days<=0) return "—";
  var months=Math.round(days/30.44);
  if(months>=12 && months%12===0) return (months/12)+(months===12?" year":" years");
  if(months>=1) return months+(months===1?" month":" months");
  return days+" days";
}
function expiryState(iso){
  if(!iso) return {k:"",t:"Not set",d:null};
  var d=daysUntil(iso);
  if(d<0) return {k:"crit",t:"Expired "+(-d)+"d ago",d:d};
  if(d===0) return {k:"crit",t:"Expires today",d:d};
  if(d<=settings.remindDays) return {k:"warn",t:"Expires in "+d+"d",d:d};
  return {k:"good",t:"Valid",d:d};
}
function vehicleById(id){return Store.data.vehicles.find(function(v){return v.id===id;});}
function vLabel(v){return v?(v.plate||"—"):"(deleted vehicle)";}
function vName(v){return v?[v.make,v.model].filter(Boolean).join(" "):"";}
function sortedVehicles(){return Store.data.vehicles.slice().sort(function(a,b){return String(a.plate||"").localeCompare(String(b.plate||""));});}
function opts(list,sel,blank){return (blank!=null?'<option value="">'+esc(blank)+'</option>':"")+list.map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(String(sel)===String(v)?" selected":"")+'>'+esc(l)+'</option>';}).join("");}
function vehicleOpts(sel){return '<option value="">Select vehicle…</option>'+sortedVehicles().map(function(v){return '<option value="'+esc(v.id)+'"'+(v.id===sel?" selected":"")+'>'+esc(v.plate)+" — "+esc(vName(v)||v.type||"")+'</option>';}).join("");}
function get(o,path){return path.split(".").reduce(function(a,k){return a==null?undefined:a[k];},o);}
function fld(label,name,val,type,cls,extra){
  type=type||"text";
  return '<label class="'+(cls||"")+'">'+label+'<input type="'+type+'" name="'+name+'" value="'+esc(val==null?"":val)+'"'+(type==="number"?' step="0.01" min="0"':"")+(extra||"")+'></label>';
}
function formToObj(form){
  var o={};
  new FormData(form).forEach(function(v,k){
    if(typeof v!=="string") return;
    var p=k.split("."),t=o; while(p.length>1){var x=p.shift();t=t[x]=t[x]||{};} t[p[0]]=v.trim();
  });
  return o;
}
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show");},2600);}
function setSync(k,t){$("#syncDot").className="dot "+k;$("#syncText").textContent=t;}
function spLink(url,label){return url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+(label||"Open document")+' ↗</a>':'<span class="hint">No document linked</span>';}

/* ================= ALERTS ================= */
function collectAlerts(){
  var out=[];
  Store.data.vehicles.forEach(function(v){
    STATUTORY.forEach(function(s){
      var x=v[s.key]; if(!x||!x.expiry) return;
      var st=expiryState(x.expiry); if(st.k==="warn"||st.k==="crit") out.push({v:v,s:s,st:st,exp:x.expiry,cost:x.cost});
    });
  });
  Store.data.service_records.forEach(function(r){
    if(r.kind==="incident"||!r.nextDate) return;
    var later=Store.data.service_records.some(function(o){return o!==r&&o.kind!=="incident"&&o.vehicleId===r.vehicleId&&(o.date||"")>(r.date||"");});
    if(later) return;
    var st=expiryState(r.nextDate); if(st.k==="warn"||st.k==="crit"){
      st=Object.assign({},st,{t:st.d<0?"Overdue "+(-st.d)+"d":st.d===0?"Due today":"Due in "+st.d+"d"});
      out.push({v:vehicleById(r.vehicleId),s:{label:"Periodic service"},st:st,exp:r.nextDate});
    }
  });
  return out.sort(function(a,b){return a.st.d-b.st.d;});
}
function maybeNotify(alerts){
  if(!("Notification" in window)||Notification.permission!=="granted"||!alerts.length) return;
  var key="fdc_notified_"+todayISO(); if(lsGet(key,false)) return;
  var exp=alerts.filter(function(a){return a.st.k==="crit";}).length;
  new Notification("FDC Vehicle Management",{body:(exp?exp+" expired / overdue, ":"")+(alerts.length-exp)+" expiring within "+settings.remindDays+" days. Open the portal to review."});
  lsSet(key,true);
}

/* ================= STATE & RENDER ================= */
var state = {view:"vehicles", q:"", ftype:"", ffuel:"", fstatus:"", svcTab:"periodic", fuelVeh:"", fuelMonth:"", svcVeh:"", drawerId:null};
var notifiedOnce=false;
function render(){
  $$("#nav button").forEach(function(b){b.classList.toggle("on",b.dataset.view===state.view);});
  var alerts=collectAlerts(), b=$("#alertBadge");
  b.hidden=!alerts.length; b.textContent=alerts.length;
  $("#whoName").textContent=userName||"—";$("#whoEmail").textContent=currentUser?currentUser.email:"";
  var m=$("#main");

  else if(state.view==="fueling") m.innerHTML=viewFueling();
  else m.innerHTML=viewServicing();
  if(state.drawerId) renderDrawer();
  if(!notifiedOnce && currentUser && Store.data.vehicles.length){notifiedOnce=true;maybeNotify(alerts);}
}

/* ---------- Vehicle Details view ---------- */

  var list=sortedVehicles().filter(function(v){
    if(state.ftype&&v.type!==state.ftype) return false;

    if(!q) return true;

  });
  var h='<div class="top"><div><h1>Vehicle Details</h1><p>All corporate vehicles, statutory documents and renewal dates.</p></div>'+
    '<button class="btn primary" data-act="addVehicle">+ Add Vehicle</button></div>'+

      kpi("Total vehicles",vs.length,"",vs.filter(function(v){return (v.status||"Active")==="Active";}).length+" active")+
      kpi("Expired documents",expired,expired?"crit":"","Annual fee, insurance, roadworthiness")+
      kpi("Expiring ≤ "+settings.remindDays+" days",expiring,expiring?"warn":"","Renew soon")+
      kpi("Statutory cost (current)",money0(annual),"","Sum of latest renewal costs")+
    '</div>';
  h+='<section class="panel"><div class="panel-h"><h2>Needs attention</h2><span class="hint">Items expiring within '+settings.remindDays+' days or already expired</span></div>';
  if(!alerts.length) h+='<div class="empty">Nothing due. All statutory documents are valid.</div>';
  else h+='<ul class="alerts">'+alerts.map(function(a){
    return '<li data-act="openVehicle" data-id="'+esc(a.v&&a.v.id)+'"><span class="dot '+a.st.k+'"></span><div class="what"><b class="mono">'+esc(vLabel(a.v))+'</b> · '+esc(a.s.label)+' <span class="hint">('+fmtDate(a.exp)+')</span></div><span class="pill '+a.st.k+'">'+esc(a.st.t)+'</span></li>';
  }).join("")+'</ul>';
  h+='</section>';
  h+='<div class="toolbar"><input class="grow" type="search" placeholder="Search plate, make, model, driver…" value="'+esc(state.q)+'" data-bind="q">'+
    '<select data-bind="ftype">'+opts(VEHICLE_TYPES,state.ftype,"All types")+'</select>'+
    '<select data-bind="ffuel">'+opts(FUEL_TYPES,state.ffuel,"All fuel")+'</select>'+
    '<select data-bind="fstatus">'+opts(STATUSES,state.fstatus,"All status")+'</select></div>';
  if(!vs.length) h+='<div class="panel"><div class="empty">No vehicles yet.<br><br><button class="btn primary" data-act="addVehicle">+ Add your first vehicle</button></div></div>';
  else if(!list.length) h+='<div class="panel"><div class="empty">No vehicles match these filters.</div></div>';
  else h+='<div class="cards">'+list.map(vehicleCard).join("")+'</div>';
  return h;
}
function kpi(l,v,cls,s){return '<div class="kpi"><div class="l">'+l+'</div><div class="v '+(cls||"")+'">'+v+'</div><div class="s">'+(s||"")+'</div></div>';}
function vehicleCard(v){

function compressImage(file){
  return new Promise(function(res,rej){
    var r=new FileReader(); r.onerror=rej;
    r.onload=function(){var img=new Image();img.onerror=rej;img.onload=function(){
      var max=1000,w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.72));};img.src=r.result;};
    r.readAsDataURL(file);
  });
}

      currentUser=user||null; ready();
      if(user){
        userName=user.displayName||user.email.split("@")[0];
        showAuth(false); Store.start(); saveProfile(); render();
      }else{
        userName=""; Store.stop(); notifiedOnce=false; state.drawerId=null; render(); showAuth(true); setSync("","Signed out");
      }
    });
  },
  submit:async function(f){
    var email=f.email.value.trim().toLowerCase(), pw=f.password.value;
    if(!email||!pw){authMsg("Enter your email and password.");return;}
    if(authMode==="login"){
      await firebase.auth().signInWithEmailAndPassword(email,pw);
      return true;
    }
    var name=f.name.value.trim();
    if(!name){authMsg("Please enter your full name.");return;}
    if(!/^\S+@\S+\.\S+$/.test(email)){authMsg("That email address is not valid.");return;}
    if(ALLOWED_EMAIL_DOMAINS.length && ALLOWED_EMAIL_DOMAINS.indexOf(email.split("@")[1])<0){authMsg("Please register with your company email ("+ALLOWED_EMAIL_DOMAINS.map(function(d){return "@"+d;}).join(", ")+").");return;}
    if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw)){authMsg("Password must be at least 8 characters and include a letter and a number.");return;}
    if(pw!==f.password2.value){authMsg("Passwords do not match.");return;}
    var cred=await firebase.auth().createUserWithEmailAndPassword(email,pw);
    await cred.user.updateProfile({displayName:name});
    userName=name; currentUser=cred.user; saveProfile(); render();
    cred.user.sendEmailVerification().catch(function(){});
    toast("Account created — welcome, "+name);
    return true;
  },
  forgot:async function(){
    var email=$('#authForm [name=email]').value.trim();
    if(!email){authMsg("Type your email address above, then click “Forgot password?” again.");return;}
    try{await firebase.auth().sendPasswordResetEmail(email);authMsg("If an account exists for "+email+", a password reset link has been sent. Check your inbox (and spam).",true);}
    catch(e){authMsg(authErr(e));}
  }
};
document.addEventListener("submit",async function(e){
  if(e.target.id!=="authForm") return; e.preventDefault();
  var b=$("#authSubmit"); b.disabled=true; authMsg("");
  var label=b.textContent; b.textContent=authMode==="login"?"Signing in…":"Creating account…";
  try{ if(await Auth.submit(e.target)){ e.target.password.value=""; e.target.password2.value=""; } }
  catch(err){ console.warn(err); authMsg(authErr(err)); }
  finally{ b.disabled=false; b.textContent=label; }
});
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-auth]"); if(t){setAuthMode(t.dataset.auth);return;}
  var a=e.target.closest("[data-act]"); if(!a) return;
  if(a.dataset.act==="togglePw"){e.preventDefault();var i=a.previousElementSibling;i.type=i.type==="password"?"text":"password";a.textContent=i.type==="password"?"Show":"Hide";}
  if(a.dataset.act==="toggleTheme") toggleTheme();
  if(a.dataset.act==="forgotPw") Auth.forgot();
  if(a.dataset.act==="signOut") firebase.auth().signOut().then(function(){toast("Signed out");});
  if(a.dataset.act==="changePw" && currentUser) firebase.auth().sendPasswordResetEmail(currentUser.email).then(function(){toast("Reset link sent to "+currentUser.email);}).catch(function(err){toast(authErr(err));});
});

/* ================= EVENTS ================= */
document.addEventListener("click",function(e){
  var nb=e.target.closest("#nav button"); if(nb){state.view=nb.dataset.view;closeDrawer();render();window.scrollTo(0,0);return;}
  if(e.target.id==="overlay"){closeModal();return;}
  var a=e.target.closest("[data-act]"); if(!a) return;
  var id=a.dataset.id, act=a.dataset.act;
  switch(act){
    case "addVehicle": openVehicleForm(null); break;
    case "editVehicle": openVehicleForm(id); break;
    case "openVehicle": if(id&&vehicleById(id)) openDrawer(id); break;
    case "closeDrawer": closeDrawer(); break;
    case "closeModal": closeModal(); break;
    case "renew": openRenew(id,a.dataset.key); break;
    case "clearImg": pendingImage="";$("#imgPrev").innerHTML="No photo";a.remove(); break;
    case "delVehicle":
      var vid=id||(modalCtx&&modalCtx.id), v=vehicleById(vid);
      confirmBox("Delete vehicle <b>"+esc(v.plate)+"</b>? Its fuel and service records stay in the log.",async function(){await Store.remove("vehicles",vid);closeDrawer();toast("Vehicle deleted");});
      break;
    case "addFuel": if(!Store.data.vehicles.length){toast("Add a vehicle first");break;} openFuelForm(null); break;
    case "editFuel": openFuelForm(id); break;
    case "delFuel": var fid=modalCtx.id; confirmBox("Delete this fuel entry?",async function(){await Store.remove("fuel_records",fid);toast("Deleted");}); break;
    case "addPeriodic": if(!Store.data.vehicles.length){toast("Add a vehicle first");break;} openServiceForm(null,"periodic"); break;
    case "addIncident": if(!Store.data.vehicles.length){toast("Add a vehicle first");break;} openServiceForm(null,"incident"); break;
    case "editService": openServiceForm(id); break;
    case "delService": var sid=modalCtx.id; confirmBox("Delete this service record?",async function(){await Store.remove("service_records",sid);toast("Deleted");}); break;
    case "svcTab": state.svcTab=a.dataset.tab; render(); break;
    case "settings": openSettings(); break;
    case "enableNotif": Notification.requestPermission().then(function(){closeModal();openSettings();maybeNotify(collectAlerts());}); break;
  }
});
document.addEventListener("input",function(e){
  var b=e.target.dataset&&e.target.dataset.bind;
  if(b&&e.target.type==="search"){state[b]=e.target.value;var pos=e.target.selectionStart;render();var s=$('[data-bind="'+b+'"]');s.focus();s.setSelectionRange(pos,pos);}
  if(e.target.hasAttribute&&e.target.hasAttribute("data-calc")){var f=e.target.form,L=num(f.litres.value),R=num(f.rate.value);if(L&&R)f.total.value=(L*R).toFixed(2);}
});
document.addEventListener("change",async function(e){
  var t=e.target, b=t.dataset&&t.dataset.bind;
  if(b&&t.tagName==="SELECT"){state[b]=t.value;render();return;}
  if(t.id==="imgFile"&&t.files[0]){
    try{pendingImage=await compressImage(t.files[0]);$("#imgPrev").innerHTML='<img src="'+pendingImage+'" alt="">';}catch(err){toast("Could not read that image");}
  }
  if(t.hasAttribute("data-dur")||t.hasAttribute("data-dur-start")){
    var fs=t.closest("fieldset"), st=fs.querySelector("[data-dur-start]"), du=fs.querySelector("[data-dur]"), en=fs.querySelector("[data-dur-end]");
    if(st.value&&du.value) en.value=addMonths(st.value,+du.value);
  }
  if(t.hasAttribute("data-dur-end")){var fs2=t.closest("fieldset");fs2.querySelector("[data-dur]").value="";}
  if(t.hasAttribute("data-fuelveh")){var v=vehicleById(t.value);if(v&&v.fuelType)t.form.fuelType.value=v.fuelType;}
});
document.addEventListener("submit",async function(e){
  if(e.target.id!=="mform") return; e.preventDefault();
  var f=e.target, btn=f.querySelector('button[type=submit]'); btn.disabled=true;
  try{
    switch(modalCtx&&modalCtx.type){
      case "vehicle": await saveVehicle(f); break;
      case "renew": await saveRenew(f); break;
      case "fuel": await saveFuel(f); break;
      case "service": await saveService(f); break;
      case "confirm": var fn=modalCtx.fn; closeModal(); await fn(); break;
      case "settings":
        var o=formToObj(f);
        if(o.name&&o.name!==userName&&currentUser){await currentUser.updateProfile({displayName:o.name});userName=o.name;saveProfile();}
        settings.remindDays=Math.max(1,Math.round(num(o.remindDays))||30); settings.currency=o.currency||"Rf"; settings.spBase=o.spBase||"";
        lsSet("fdc_settings",settings); lsSet("fdc_theme",o.theme||""); applyTheme(); closeModal(); render(); toast("Settings saved"); break;
    }
  }catch(err){ if(err){console.error(err); toast("Save failed: "+(err.message||err));} }
  finally{ if(btn.isConnected) btn.disabled=false; }
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(!$("#overlay").hidden)closeModal();else if(state.drawerId)closeDrawer();}});

/* ================= BOOT ================= */
applyTheme();
render();
Auth.init();
</script>
